title = "Meminit Secret Scanning"

[allowlist]
description = "Global allowlist for non-secret patterns"
paths = [
  '''.git/''',
  '''.venv/''',
  '''venv/''',
  '''__pycache__/''',
  '''.pytest_cache/''',
  '''.meminit/cache/''',
  '''(^|/)\.meminit\.lock$''',
  '''\.pyc''',
  '''dist/''',
  '''build/''',
  '''\.egg-info/''',
]

[[rules]]
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret|secret[_-]?key|client[_-]?secret)['\"]?\s*[:=]\s*['\"]?([a-zA-Z0-9_\-]{16,})'''
tags = ["key", "api"]

[[rules]]
description = "AWS Access Key"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "cloud"]

[[rules]]
description = "GitHub Personal Access Token"
regex = '''ghp_[a-zA-Z0-9]{36}'''
tags = ["github"]

[[rules]]
description = "GitLab Personal Access Token"
regex = '''glpat-[a-zA-Z0-9\-]{20}'''
tags = ["gitlab"]

[[rules]]
description = "Slack Token"
regex = '''xox[baprs]-[a-zA-Z0-9\-]{10,}'''
tags = ["slack"]

[[rules]]
description = "Password in code"
regex = '''(?i)(password|passwd|pwd)['\"]?\s*[:=]\s*['\"]?([^\s'\"]{6,})'''
tags = ["password"]
