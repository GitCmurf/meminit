name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  docops:
    name: docops
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Meminit doctor (preflight)
        run: |
          uv run meminit doctor --root . --format json
      - name: Meminit check (enforcement)
        run: |
          uv run meminit check --root . --format json

  python:
    name: python
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml
          verbose: true
      - name: Enforce pre-commit rules
        run: |
          uv run pre-commit run --all-files
      - name: Check all frontmatter envelopes
        run: |
          uv run python check_all_envelopes.py
      - name: Test with pytest
        run: |
          uv run pytest

  slow-scale:
    name: slow scale fixtures
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run slow scale tests
        env:
          MEMINIT_RUN_SLOW_SCALE: "1"
        run: |
          uv run pytest -m slow
