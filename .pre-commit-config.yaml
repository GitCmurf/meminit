exclude: (?i)(^|.*/)(WIP-[^/]+)(/|$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(\.codex/skills/meminit-docops|\.agents/skills/meminit-docops/).*$
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Governed template trees use Meminit placeholders that Prettier rewrites.
        exclude: ^(docs/00-governance/templates/|src/meminit/core/assets/org_profiles/default/templates/).*$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml, --verbose]
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: meminit-check
        name: Meminit Compliance Check
        entry: meminit check
        language: system
        files: ^docs/
        pass_filenames: false
